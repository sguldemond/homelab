repos:
  - repo: local
    hooks:
      - id: revert-journal
        name: Revert JOURNAL.md into web/content/journal.md
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && scripts/revert-journal.sh && git add web/content/journal.md 2>/dev/null || true'
        language: system
        files: ^JOURNAL\.md$
        pass_filenames: false
        always_run: false
        stages: [pre-commit]
      - id: prepare-readme-for-hugo
        name: Copy README.md into web/content/homelab.md for hugo
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && scripts/prepare-readme-for-hugo.sh && git add web/content/homelab.md 2>/dev/null || true'
        language: system
        files: ^README\.md$
        pass_filenames: false
        always_run: false
        stages: [pre-commit]
