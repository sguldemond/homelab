{{/* Extra favicon sizes; the .ico and apple-touch-icon come from params in head.html. */}}
<link rel="icon" type="image/png" sizes="32x32" href="{{ "favicon-32x32.png" | absURL }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ "favicon-16x16.png" | absURL }}">

<style>
  /* goblin logo on the home page, flush left with the title below it */
  .home-info .home-logo {
    display: block;
    margin: 0 0 var(--gap, 24px);
    border-radius: 12px;
    max-width: 180px;
    height: auto;
  }
  /* the artwork has a black background, so give it a glow instead of a hard edge */
  .home-info .home-logo,
  .logo img {
    background: #000;
  }
  .logo img {
    border-radius: 6px;
    margin-inline-end: 8px;
    vertical-align: middle;
  }

  /* the theme Title-Cases every list/page heading; keep titles as written */
  .page-header h1 {
    text-transform: none;
  }

  /* lift images in posts off the page — mostly screenshots.
     height:auto matters: the render hook emits intrinsic width/height
     attributes and the theme's reset caps width without releasing height,
     so without it images squash vertically on narrow screens. */
  .post-content img {
    height: auto;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .10), 0 8px 24px rgba(0, 0, 0, .12);
  }
  .dark .post-content img {
    box-shadow: 0 2px 6px rgba(0, 0, 0, .40), 0 8px 24px rgba(0, 0, 0, .45);
  }

  /* labelled social links: icon and word on one baseline */
  .social-icons a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .social-icons a:not(:last-of-type) {
    margin-right: 18px;
  }
  .social-label {
    font-size: 15px;
  }
</style>
