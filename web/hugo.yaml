baseURL: "https://readme.stansyfert.com/"
title: "stan syfert"
theme: PaperModX
locale: en-us

enableInlineShortcodes: true
enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false

# keep auto-generated titles (taxonomies, terms) as written instead of Title Cased
titleCaseStyle: none

disableKinds:
  - rss

pagination:
  pagerSize: 10

params:
  env: production
  description: "notes on platform engineering, kubernetes and whatever else i'm poking at"
  author: "stan syfert"
  mainSections:
    - posts
  DateFormat: "02-01-2006"

  defaultTheme: light
  ShowReadingTime: false
  ShowWordCount: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  # no TocSide: the side TOC pins itself to the far right edge above 1350px,
  # miles from the text. Without it the TOC stays inline above the content at
  # every width.
  EnableInstantClick: true
  EnableImageZoom: true
  disableAnchoredHeadings: true

  # header logo, resolved from web/assets/
  logo:
    icon: images/goblin-logo.png
    iconHeight: 30
    iconWidth: 30

  favicon: "/favicon.ico"
  appleTouchIcon: "/apple-touch-icon.png"

  # fallback social/link-preview image
  images: ["/images/goblin-logo.png"]

  homeInfoParams:
    Title: "stan syfert"
    Content: |
      i love building systems with people. wore different engineering hats over the years, software, platform, integration. what doesn't change: making a system tick, then making it stick.
      
      software i enjoy working with currently:
      **kubernetes, go, python, argo-cd/workflow/events, ansible, fedora-kinoite/rpm-ostree, suse-linux-micro**

      - [posts](/posts/) — my blog
      - [homelab](/homelab/) — what my lab actually is
      - [journal](/journal/) — chronological log of what broke
      - [resume](/resume/) — where i've worked, as a pdf

  socialIcons:
    - name: github
      label: github
      url: "https://github.com/sguldemond"
    - name: linkedin
      label: linkedin
      url: "https://www.linkedin.com/in/stan-syfert-56291b120/"

menu:
  main:
    - name: posts
      url: /posts/
      weight: 1
    - name: homelab
      url: /homelab/
      weight: 2
    - name: journal
      url: /journal/
      weight: 3
    - name: resume
      url: /resume/
      weight: 4
    - name: tags
      url: /tags/
      weight: 5
    - name: search
      url: /search/
      weight: 6

outputs:
  home:
    - HTML
    - JSON

taxonomies:
  tag: tags

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: dracula
    lineNos: false
    noClasses: false

minify:
  disableXML: true
